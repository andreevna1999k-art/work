<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Poppins,sans-serif;background:#54B435}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 900px 1000px at 560px 560px,#F6FFEE 0%,#BDE9A2 30%,#54B435 62%,#2F7A20 100%)}
.mast{position:absolute;left:0;right:0;top:40px;text-align:center;font:900 360px/1 Poppins,sans-serif;color:#0F1B2D;white-space:nowrap;letter-spacing:-10px}
.dateline{position:absolute;left:40px;top:380px;z-index:5;color:#0F1B2D}
.dateline b{display:block;font:700 30px/1.1 Poppins,sans-serif;letter-spacing:.02em}
.dateline span{display:block;font:500 20px/1.3 Poppins,sans-serif;margin-top:4px}
.cats{position:absolute;right:40px;top:390px;z-index:5;font:600 22px/1 Poppins,sans-serif;letter-spacing:.1em;color:#0F1B2D}
.photo{position:absolute;left:-88px;top:95px;width:1180px;z-index:2}
.photo img{width:100%;display:block}
.shade{position:absolute;left:0;right:0;top:880px;height:560px;background:linear-gradient(180deg,rgba(11,42,20,0),rgba(11,42,20,.94) 70%,#0B2A14);z-index:3}
.base{position:absolute;left:0;right:0;top:1430px;bottom:0;background:#0B2A14;z-index:3}
.tips{position:absolute;left:36px;top:480px;width:300px;z-index:5}
.tips .t{background:#0F1B2D;color:#fff;font:700 25px/1.25 Poppins,sans-serif;text-transform:uppercase;padding:10px 14px;margin-bottom:10px;border-left:6px solid #54B435}
.tip-lab{display:inline-block;background:#EDFBE2;color:#0F1B2D;font:700 20px/1 Poppins,sans-serif;letter-spacing:.2em;padding:8px 14px;margin-bottom:12px}
.stat{position:absolute;right:36px;top:470px;width:270px;z-index:5;text-align:right;color:#0F1B2D}
.stat .n{display:inline-block;white-space:nowrap;font:800 120px/1 Poppins,sans-serif;color:#0F1B2D}
.stat .l{display:inline-block;white-space:nowrap;font:800 36px/1.1 Poppins,sans-serif;letter-spacing:.02em;text-transform:uppercase}
.stat .s{font:600 24px/1.25 Poppins,sans-serif;margin-top:8px;text-transform:uppercase}
.sticker{position:absolute;right:46px;top:790px;width:180px;height:180px;border-radius:50%;background:#EDFBE2;color:#0F1B2D;z-index:5;transform:rotate(10deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:800 26px/1.1 Poppins,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sticker small{font:700 16px/1.2 Poppins,sans-serif;letter-spacing:.12em;margin-top:8px;color:#2F7A20}
.t1{position:absolute;left:40px;top:1040px;white-space:nowrap;font:300 52px/1 Poppins,sans-serif;color:#fff;text-transform:uppercase;letter-spacing:.02em;z-index:6}
.t2{position:absolute;left:40px;top:1105px;width:1000px;font:700 124px/1.0 Poppins,sans-serif;color:#EDFBE2;text-transform:uppercase;z-index:6;letter-spacing:-2px}
.sub{position:absolute;left:40px;right:40px;top:1566px;display:flex;gap:14px;z-index:6}.sub div{flex:1;border:3px solid #54B435;color:#fff;border-radius:50px;text-align:center;padding:18px 8px;font:700 26px/1.1 Poppins,sans-serif;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;background:rgba(84,180,53,.12)}
.cta{position:absolute;left:40px;right:40px;top:1700px;height:100px;background:#54B435;color:#fff;font:700 40px/1 Poppins,sans-serif;display:flex;align-items:center;justify-content:center;z-index:6;border-radius:50px}
.dom{position:absolute;left:0;right:0;top:1826px;text-align:center;color:#BDE9A2;font:500 26px/1 Poppins,sans-serif;letter-spacing:.2em;z-index:6}
</style></head><body>
<div class="bg"></div>
<div class="mast" id="mast"><span id="mastt" style="display:inline-block">ПОЗИКИ</span></div>
<div class="dateline"><b id="iss"></b><span>profconsulting.com.ua</span></div>
<div class="cats">КРЕДИТИ | МФО | БОРГИ</div>
<div class="photo"><img src="portrait-cutout.png"></div>
<div class="shade"></div><div class="base"></div>
<div class="tips"><span class="tip-lab">ВАЖЛИВО</span><div id="tips"></div></div>
<div class="stat"><div class="n" id="sn"></div><div class="l" id="sl"></div><div class="s" id="ss"></div></div>
<div class="sticker">НОВА<br>СТАТТЯ<small>ЧИТАЙТЕ ↓</small></div>
<div class="t1" id="t1"></div><div class="t2" id="t2"></div><div class="sub" id="sub"></div>
<div class="cta">Читайте мою нову статтю</div><div class="dom">PROFCONSULTING.COM.UA</div>
<script>
const p=new URLSearchParams(location.search);const d=JSON.parse(p.get('d'));
document.getElementById('iss').textContent='ВИПУСК №'+d.n;
document.getElementById('tips').innerHTML=d.tips.map(t=>'<div class="t">'+t+'</div>').join('');
document.getElementById('sn').textContent=d.stat[0];document.getElementById('sl').textContent=d.stat[1];document.getElementById('ss').textContent=d.stat[2];
document.getElementById('t1').textContent=d.t1;document.getElementById('t2').textContent=d.t2;
document.getElementById('sub').innerHTML=d.gold.split(' · ').map(function(x){return '<div>'+x+'</div>'}).join('');
function fit(el,max,w){let s=max;el.style.fontSize=s+'px';while(el.scrollWidth>w&&s>14){s-=2;el.style.fontSize=s+'px'}}
document.fonts.ready.then(()=>{
 fit(document.getElementById('t1'),52,1000);fit(document.getElementById('sn'),120,270);fit(document.getElementById('sl'),36,270);
 var t2=document.getElementById('t2'),z=124;var ms=document.createElement('span');ms.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:700 124px/1 Poppins;letter-spacing:-2px;text-transform:uppercase';document.body.appendChild(ms);var mw=0;d.t2.split(' ').forEach(function(w){ms.textContent=w;mw=Math.max(mw,ms.offsetWidth)});z=Math.min(124,Math.floor(124*960/mw));t2.style.fontSize=z+'px';while(t2.offsetHeight>400&&z>40){z-=4;t2.style.fontSize=z+'px'}t2.style.top=(1105+Math.max(0,(430-t2.offsetHeight)/2))+'px';
 document.querySelectorAll('.sub div').forEach(function(e){fit(e,26,300)});
 (function(){var m=document.getElementById('mast'),t=document.getElementById('mastt'),zz=360;m.style.fontSize=zz+'px';while(t.offsetWidth>1000&&zz>80){zz-=4;m.style.fontSize=zz+'px'}})();
 document.title='ready'});
</script></body></html>
