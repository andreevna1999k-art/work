<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Inter,sans-serif;background:#1B2210}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 800px 900px at 560px 620px,#6B7C35 0%,#44521F 40%,#2B3516 72%,#1B2210 100%)}
.mast{position:absolute;left:0;right:0;top:50px;text-align:center;font:400 330px/1 Marcellus,serif;color:#fff;white-space:nowrap;letter-spacing:-4px}
.photo{position:absolute;left:-230px;top:195px;width:1500px;z-index:2}
.photo img{width:100%;display:block}
.fade{position:absolute;left:0;right:0;top:1130px;height:300px;background:linear-gradient(180deg,rgba(27,34,16,0),#1B2210 82%);z-index:3}
.base{position:absolute;left:0;right:0;top:1420px;bottom:0;background:#1B2210;z-index:3}
.iss{position:absolute;left:56px;top:400px;z-index:5;font:500 22px/1.3 Inter,sans-serif;letter-spacing:.22em;color:#C5E485;text-transform:uppercase}
.q{position:absolute;left:56px;top:480px;z-index:5;color:#fff;width:250px}
.q .a{font:400 28px/1.15 Marcellus,serif;letter-spacing:.06em;text-transform:uppercase}
.q .n{display:inline-block;white-space:nowrap;font:400 128px/1 Marcellus,serif;margin:6px 0}
.q .b{font:400 26px/1.2 Marcellus,serif;letter-spacing:.05em;text-transform:uppercase;color:#C5E485}
.tag{position:absolute;right:56px;top:400px;z-index:5;font:500 22px/1.3 Inter,sans-serif;letter-spacing:.22em;color:#C5E485;text-transform:uppercase;text-align:right}
.sticker{position:absolute;right:50px;top:560px;width:180px;height:180px;border-radius:50%;background:#C5E485;color:#343F1E;z-index:5;transform:rotate(10deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:400 28px/1.1 Marcellus,serif;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sticker small{font:600 15px/1.2 Inter,sans-serif;letter-spacing:.14em;margin-top:8px;text-transform:uppercase}
.t1{position:absolute;left:56px;top:1000px;font:500 28px/1 Inter,sans-serif;letter-spacing:.34em;color:#C5E485;text-transform:uppercase;z-index:6;white-space:nowrap}
.t2{position:absolute;left:56px;top:1048px;width:968px;font:400 104px/1.02 Marcellus,serif;color:#fff;text-transform:uppercase;z-index:6;text-shadow:0 4px 24px rgba(0,0,0,.55)}
.tips{position:absolute;left:56px;right:56px;top:1430px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;z-index:6}
.tips div{border-top:3px solid #C5E485;padding-top:16px;color:#fff;font:500 25px/1.3 Inter,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.sub{position:absolute;left:56px;top:1640px;z-index:6;color:#C7D3B0;font:400 26px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.cta{position:absolute;left:56px;right:56px;top:1710px;height:96px;background:#70A309;color:#fff;font:400 38px/1 Marcellus,serif;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;z-index:6;border-radius:48px}
.dom{position:absolute;left:0;right:0;top:1838px;text-align:center;color:#C5E485;font:500 24px/1 Inter,sans-serif;letter-spacing:.24em;z-index:6}
</style></head><body>
<div class="bg"></div>
<div class="mast" id="mast"><span id="mastt" style="display:inline-block">АРГУМЕНТ</span></div>
<div class="photo"><img src="portrait-cutout.png"></div>
<div class="fade"></div><div class="base"></div>
<div class="iss" id="iss"></div><div class="tag">Кредитні<br>договори</div>
<div class="q"><div class="a" id="sa"></div><div class="n" id="sn"></div><div class="b" id="sb"></div></div>
<div class="sticker">НОВА<br>СТАТТЯ<small>Читайте ↓</small></div>
<div class="t1" id="t1"></div><div class="t2" id="t2"></div>
<div class="tips" id="tips"></div><div class="sub" id="sub"></div>
<div class="cta">Читайте мою нову статтю</div><div class="dom">ARGUMENT-CONSULTING.COM.UA</div>
<script>
const p=new URLSearchParams(location.search);const d=JSON.parse(p.get('d'));
document.getElementById('iss').textContent='Випуск № '+d.n;
document.getElementById('tips').innerHTML=d.tips.map(t=>'<div>'+t+'</div>').join('');
var s0=d.stat[0],s1=d.stat[1];var big=s0.length<=s1.length?s0:s1,small=s0.length<=s1.length?s1:s0;document.getElementById('sa').textContent=small;document.getElementById('sn').textContent=big;document.getElementById('sb').textContent=d.stat[2];
document.getElementById('t1').textContent=d.t1;document.getElementById('t2').textContent=d.t2;
document.getElementById('sub').textContent=d.gold;
function fit(el,max,w){let s=max;el.style.fontSize=s+'px';while(el.scrollWidth>w&&s>14){s-=2;el.style.fontSize=s+'px'}}
document.fonts.ready.then(()=>{
 fit(document.getElementById('sn'),120,250);fit(document.getElementById('sub'),26,968);fit(document.getElementById('t1'),28,968);
 var t2=document.getElementById('t2'),z=104;var ms=document.createElement('span');ms.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:400 104px/1 Marcellus;text-transform:uppercase';document.body.appendChild(ms);var mw=0;d.t2.split(' ').forEach(function(w){ms.textContent=w;mw=Math.max(mw,ms.offsetWidth)});z=Math.min(104,Math.floor(104*940/mw));t2.style.fontSize=z+'px';while(t2.offsetHeight>330&&z>40){z-=2;t2.style.fontSize=z+'px'}
 (function(){var m=document.getElementById('mast'),t=document.getElementById('mastt'),zz=330;m.style.fontSize=zz+'px';while(t.offsetWidth>980&&zz>80){zz-=4;m.style.fontSize=zz+'px'}})();
 document.title='ready'});
</script></body></html>
