<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:'DM Sans',sans-serif;background:#2E1700}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 800px 760px at 540px 880px,#9A5A1C 0%,#663300 36%,#2E1700 70%,#1A0D00 100%)}
.ring{position:absolute;left:150px;top:430px;width:820px;height:820px;border-radius:50%;border:6px solid rgba(255,165,0,.5)}
.top{position:absolute;left:56px;right:56px;top:46px;display:flex;justify-content:space-between;font:700 24px/1 'DM Sans',sans-serif;letter-spacing:.2em;color:#FFA500}
.mast{position:absolute;left:0;right:0;top:132px;display:block;text-align:center;font:800 330px/1 Jost,sans-serif;color:#F3E6CE;letter-spacing:-6px;white-space:nowrap}
.strip{position:absolute;left:0;right:0;top:420px;height:58px;background:#FFA500;color:#2E1700;display:flex;align-items:center;justify-content:center;font:700 25px/1 'DM Sans',sans-serif;letter-spacing:.24em;z-index:1}
.photo{position:absolute;left:30px;top:438px;width:1000px;z-index:2}
.photo img{width:100%;display:block;filter:contrast(1.04) saturate(1.05)}
.fade{position:absolute;left:0;right:0;top:1120px;height:150px;background:linear-gradient(180deg,rgba(26,13,0,0),#1A0D00);z-index:3}
.panel{position:absolute;left:0;right:0;top:1268px;bottom:0;background:#1A0D00;z-index:3}
.tips{position:absolute;left:56px;top:520px;width:268px;z-index:4}
.tip-label{display:inline-block;background:#FFA500;color:#2E1700;font-weight:700;font-size:24px;letter-spacing:.14em;padding:8px 16px}
.tips .t{margin-top:12px;background:#663300;color:#fff;font-weight:700;font-size:24px;line-height:1.2;padding:10px 14px;text-transform:uppercase;border-left:6px solid #FFA500}
.badge{position:absolute;right:46px;top:488px;width:250px;height:222px;z-index:4}
.badge svg{position:absolute;inset:0}
.badge .b1,.badge .b2{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-family:Jost,sans-serif;font-weight:800}
.badge .b1{top:78px;color:#2E1700;font-size:30px}.badge .b2{top:128px;color:#8A4A12;font-size:22px;letter-spacing:.06em}
.stat{position:absolute;right:40px;top:716px;text-shadow:0 2px 10px rgba(26,13,0,.9);width:262px;text-align:center;color:#fff;z-index:4}
.stat .n{display:inline-block;white-space:nowrap;font:800 104px/1 Jost,sans-serif;color:#FFA500}
.stat .l{font-weight:700;font-size:30px;letter-spacing:.08em;margin-top:2px}
.stat .s{font-weight:700;font-size:20px;line-height:1.25;margin-top:6px;color:#E7DFD4;word-break:break-word}
.sticker{position:absolute;left:30px;top:1000px;width:200px;height:200px;border-radius:50%;background:#FFA500;color:#2E1700;z-index:4;transform:rotate(-10deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:800 27px/1.1 Jost,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.sticker small{font:700 21px/1.2 'DM Sans',sans-serif;letter-spacing:.12em;margin-top:8px}
.t1{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;top:1292px;text-align:center;font:800 56px/1 Jost,sans-serif;color:#fff;z-index:5}
.t2{position:absolute;left:50%;transform:translateX(-50%);top:1362px;text-align:center;font:800 118px/1.05 Jost,sans-serif;color:#FFA500;white-space:nowrap;z-index:5}
.by{position:absolute;left:0;right:0;top:1520px;text-align:center;color:#fff;font:700 33px/1 'DM Sans',sans-serif;letter-spacing:.2em;white-space:nowrap;z-index:5}
.gold{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;top:1580px;text-align:center;color:#E7DFD4;font:700 25px/1 'DM Sans',sans-serif;letter-spacing:.1em;z-index:5}
.cta{position:absolute;left:56px;right:56px;top:1660px;height:92px;background:#FFA500;color:#2E1700;font:800 38px/1 Jost,sans-serif;display:flex;align-items:center;justify-content:center;z-index:5}
.dom{position:absolute;left:0;right:0;top:1796px;text-align:center;color:#fff;font:700 28px/1 'DM Sans',sans-serif;letter-spacing:.28em;z-index:5}
</style></head><body>
<div class="bg"></div><div class="ring"></div>
<div class="top"><span id="iss"></span><span>ЮРИДИЧНИЙ ЖУРНАЛ</span></div>
<div class="mast" id="mast"><span id="mastt" style="display:inline-block">ЗАХИСТ</span></div><div class="strip">ПРАВА СПОЖИВАЧІВ · МФО · ШАХРАЙСТВО</div>
<div class="photo"><img src="portrait-cutout.png"></div>
<div class="fade"></div><div class="panel"></div>
<div class="tips"><span class="tip-label">ВАЖЛИВО</span><div id="tips"></div></div>
<div class="badge"><svg viewBox="0 0 250 222"><polygon points="62,6 188,6 244,111 188,216 62,216 6,111" fill="#FBF5F1" stroke="#FFA500" stroke-width="6"/><polygon points="72,20 178,20 228,111 178,202 72,202 22,111" fill="none" stroke="#663300" stroke-width="2"/></svg>
 <div class="b1" id="b1"></div><div class="b2" id="b2"></div></div>
<div class="stat"><div class="n" id="sn"></div><div class="l" id="sl"></div><div class="s" id="ss"></div></div>
<div class="sticker">НОВА<br>СТАТТЯ<small>ЧИТАЙТЕ ↓</small></div>
<div class="t1" id="t1"></div><div class="t2" id="t2"></div>
<div class="by">ПОРАДИ ЮРИСТА МАРІЇ МЕЛЬНИК</div><div class="gold" id="gold"></div>
<div class="cta">Читайте мою нову статтю</div><div class="dom">jurist-online.info</div>
<script>
const p=new URLSearchParams(location.search);const d=JSON.parse(p.get('d'));
document.getElementById('iss').textContent='ВИПУСК '+d.n;
document.getElementById('b1').textContent=d.badge[0];document.getElementById('b2').textContent=d.badge[1];
document.getElementById('tips').innerHTML=d.tips.map(t=>'<div class="t">'+t+'</div>').join('');
document.getElementById('sn').textContent=d.stat[0];document.getElementById('sl').textContent=d.stat[1];document.getElementById('ss').textContent=d.stat[2];
document.getElementById('t1').textContent=d.t1;document.getElementById('t2').textContent=d.t2;document.getElementById('gold').textContent=d.gold;
function fit(el,max,w){let s=max;el.style.fontSize=s+'px';while(el.scrollWidth>w&&s>14){s-=2;el.style.fontSize=s+'px'}}
document.fonts.ready.then(()=>{fit(document.getElementById('b1'),30,170);fit(document.getElementById('b2'),22,170);fit(document.getElementById('t2'),118,960);fit(document.getElementById('t1'),56,960);fit(document.getElementById('gold'),25,980);fit(document.getElementById('sn'),104,250);(function(){var m=document.getElementById('mast'),t=document.getElementById('mastt'),z=330;m.style.fontSize=z+'px';while(t.offsetWidth>1000&&z>120){z-=4;m.style.fontSize=z+'px'}})();document.title='ready'});
</script></body></html>
