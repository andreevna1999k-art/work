<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,700&family=Roboto+Slab:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Roboto,sans-serif;background:#1D6096}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 1100px 900px at 900px 220px,#C9E8FB 0%,#7DB6E0 32%,#2D6FA8 62%,#0E4D80 100%)}
.mast{position:absolute;left:40px;top:96px;text-align:left;font:200 400px/1 'Roboto Slab',serif;color:#003864;white-space:nowrap;letter-spacing:-6px}
.tag{position:absolute;left:44px;top:60px;font:400 22px/1 'Roboto Slab',serif;letter-spacing:.14em;color:#003864;text-transform:uppercase}
.photo{position:absolute;left:-120px;top:250px;width:1320px;z-index:2}
.photo img{width:100%;display:block}
.fade{position:absolute;left:0;right:0;top:1340px;height:240px;background:linear-gradient(180deg,rgba(0,56,100,0),#003864 90%);z-index:3}
.base{position:absolute;left:0;right:0;top:1570px;bottom:0;background:#003864;z-index:3}
.tips{position:absolute;left:40px;top:470px;width:300px;z-index:5}
.lab{display:inline-block;background:#003864;color:#fff;font:700 20px/1 Roboto,sans-serif;letter-spacing:.2em;padding:9px 16px;margin-bottom:16px}
.tips .t{color:#fff;font:900 33px/1.12 Roboto,sans-serif;text-transform:uppercase;margin-bottom:16px;text-shadow:0 2px 12px rgba(0,40,80,.55)}
.tips .bar{width:150px;height:8px;background:#fff;margin-top:6px}
.hex{position:absolute;right:30px;top:40px;width:250px;height:198px;z-index:5}
.hex svg{position:absolute;inset:0}
.hex .a{position:absolute;left:0;right:0;top:34px;text-align:center;font:400 22px/1 'Roboto Slab',serif;letter-spacing:.2em;color:#fff}
.hex .b{position:absolute;left:0;right:0;top:72px;text-align:center;font:500 44px/.98 'Roboto Slab',serif;color:#fff;text-transform:uppercase;padding:0 30px}
.stat{position:absolute;right:30px;top:262px;width:300px;text-align:center;color:#fff;z-index:5;text-shadow:0 2px 14px rgba(0,40,80,.5)}
.stat .n{display:inline-block;white-space:nowrap;font:500 150px/1 'Roboto Slab',serif;color:#fff}
.stat .l{font:900 30px/1.1 Roboto,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.stat .s{font:500 25px/1.3 Roboto,sans-serif;margin-top:10px;text-transform:uppercase;letter-spacing:.04em}
.side{position:absolute;right:30px;top:830px;width:260px;z-index:5;color:#fff;text-align:right;text-shadow:0 2px 12px rgba(0,40,80,.6)}
.side .i{font:italic 700 30px/1.15 Roboto,sans-serif;text-transform:uppercase;color:#FFB716;margin-bottom:10px}
.side .d{font:italic 700 30px/1.15 Roboto,sans-serif;text-transform:uppercase;color:#fff;margin-bottom:10px}
.t1{position:absolute;left:30px;right:30px;top:1250px;text-align:center;font:300 66px/1 'Roboto Slab',serif;color:#fff;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;z-index:5;text-shadow:0 3px 18px rgba(0,30,60,.6)}
.t2{position:absolute;left:30px;right:30px;top:1330px;text-align:center;font:500 118px/1.04 'Roboto Slab',serif;color:#fff;text-transform:uppercase;white-space:nowrap;z-index:5;text-shadow:0 3px 18px rgba(0,30,60,.6)}
.sub{position:absolute;left:0;right:0;top:1486px;text-align:center;font:400 34px/1 'Roboto Slab',serif;color:#fff;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap;z-index:5}
.sticker{position:absolute;left:34px;top:1060px;width:178px;height:178px;border-radius:50%;background:#FFB716;color:#003864;z-index:5;transform:rotate(-10deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:700 26px/1.1 'Roboto Slab',serif;box-shadow:0 10px 30px rgba(0,30,60,.45)}
.sticker small{font:700 17px/1.2 Roboto,sans-serif;letter-spacing:.12em;margin-top:8px}
.by{position:absolute;left:0;right:0;top:1620px;text-align:center;color:#B9D4DF;font:500 26px/1 Roboto,sans-serif;letter-spacing:.2em;z-index:5}
.cta{position:absolute;left:56px;right:56px;top:1650px;height:104px;background:#FFB716;color:#003864;font:700 40px/1 'Roboto Slab',serif;display:flex;align-items:center;justify-content:center;z-index:5;border-radius:4px}
.dom{position:absolute;left:0;right:0;top:1796px;text-align:center;color:#fff;font:500 28px/1 Roboto,sans-serif;letter-spacing:.2em;z-index:5}
</style></head><body>
<div class="bg"></div>
<div class="mast" id="mast"><span id="mastt" style="display:inline-block">ВЕРДИКТ</span></div>
<div class="tag" id="tag"></div>
<div class="photo"><img src="portrait-cutout.png"></div>
<div class="fade"></div><div class="base"></div>
<div class="tips"><span class="lab">ВАЖЛИВО</span><div id="tips"></div><div class="bar"></div></div>
<div class="hex"><svg viewBox="0 0 290 230" preserveAspectRatio="none"><polygon points="72,4 218,4 286,115 218,226 72,226 4,115" fill="#003864"/></svg><div class="a">ВИПУСК</div><div class="b" id="iss"></div></div>
<div class="stat"><div class="n" id="sn"></div><div class="l" id="sl"></div><div class="s" id="ss"></div></div>
<div class="side"></div>
<div class="sticker">НОВА<br>СТАТТЯ<small>ЧИТАЙТЕ ↓</small></div>
<div class="t1" id="t1"></div><div class="t2" id="t2"></div><div class="sub" id="sub"></div>

<div class="cta">Читайте мою нову статтю</div><div class="dom">advokat-kharkov.org.ua</div>
<script>
const p=new URLSearchParams(location.search);const d=JSON.parse(p.get('d'));
document.getElementById('tag').textContent='Судовий захист позичальників';
document.getElementById('iss').textContent='№ '+d.n;
document.getElementById('tips').innerHTML=d.tips.map(t=>'<div class="t">'+t+'</div>').join('');
document.getElementById('sn').textContent=d.stat[0];document.getElementById('sl').textContent=d.stat[1];document.getElementById('ss').textContent=d.stat[2];
const g=d.gold.split(' · ');document.querySelector('.side').innerHTML=g.map(function(x,k){return '<div class="'+(k==0?'i':'d')+'">'+x+'</div>'}).join('');
document.getElementById('t1').textContent=d.t1;document.getElementById('t2').textContent=d.t2;
document.getElementById('sub').textContent='Поради юриста Євгенія Дорошенка';
function fit(el,max,w){let s=max;el.style.fontSize=s+'px';while(el.scrollWidth>w&&s>14){s-=2;el.style.fontSize=s+'px'}}
document.fonts.ready.then(()=>{fit(document.getElementById('t2'),118,1020);fit(document.getElementById('t1'),66,1020);fit(document.getElementById('sn'),130,260);fit(document.getElementById('sl'),30,300);
(function(){var m=document.getElementById('mast'),t=document.getElementById('mastt'),z=400;m.style.fontSize=z+'px';while(t.offsetWidth>740&&z>80){z-=4;m.style.fontSize=z+'px'}})();
document.title='ready'});
</script></body></html>
