<style>

.list .t:last-child{margin-bottom:0}
.qr{position:absolute;right:56px;top:1372px;width:270px;z-index:5;text-align:center;color:#EAF6FA}
.qr .lab{font:700 22px/1.2 Roboto,sans-serif;letter-spacing:.06em;margin-bottom:12px}
.qr .box{background:#fff;padding:14px;border-radius:6px}
.qr .box svg{display:block;width:100%;height:auto}
.qr .u{font:500 17px/1.2 Roboto,sans-serif;margin-top:10px;color:#B9D4DF;word-break:break-all}
.cta{position:absolute;left:56px;right:56px;top:1756px;height:88px;background:#FFB716;color:#003864;font:900 36px/1 'Roboto Slab',serif;display:flex;align-items:center;justify-content:center;z-index:5;border-radius:6px}
.by{position:absolute;left:0;right:0;top:1872px;text-align:center;color:#EAF6FA;font:500 24px/1 Roboto,sans-serif;letter-spacing:.2em;z-index:5}

<script>
const p=new URLSearchParams(location.search);const d=JSON.parse(p.get('d'));
document.getElementById('iss').textContent='ВИПУСК '+d.n+' | СУДОВИЙ ЗАХИСТ';
document.getElementById('tips').innerHTML=d.tips.map(t=>'<div class="t">'+t+'</div>').join('');

document.getElementById('t1').textContent=d.t1;document.getElementById('t2').textContent=d.t2;

function fit(el,max,w){let s=max;el.style.fontSize=s+'px';while(el.scrollWidth>w&&s>14){s-=2;el.style.fontSize=s+'px'}}
document.fonts.ready.then(()=>{
 var h=document.getElementById('head'),z=74;var words=(d.t1+' '+d.t2).split(' ');var ms=document.createElement('span');ms.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font:700 74px/1 "Roboto Condensed";text-transform:uppercase';document.body.appendChild(ms);var mw=0;words.forEach(function(w){ms.textContent=w;mw=Math.max(mw,ms.offsetWidth)});z=Math.min(74,Math.floor(74*430/mw));h.style.fontSize=z+'px';while(h.offsetHeight>560&&z>36){z-=2;h.style.fontSize=z+'px'}
 document.getElementById('subt').style.top=(360+h.offsetHeight+22)+'px';
 fit(document.getElementById('sn'),62,200);fit(document.getElementById('sl'),22,200);
 (function(){var m=document.getElementById('mast'),t=document.getElementById('mastt'),zz=300;m.style.fontSize=zz+'px';while(t.offsetWidth>968&&zz>80){zz-=4;m.style.fontSize=zz+'px'}})();
